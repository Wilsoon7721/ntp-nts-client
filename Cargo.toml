[package]
name = "nts-client"
version = "1.0.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/Wilsoon7721/ntp-nts-client"

[dependencies]
aes-siv = "0.8.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
lucide-icons = "1.73.0"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
tzf-rs = { version = "2.3.0", default-features = false, features = ["bundled"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier", "json"] }
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"
