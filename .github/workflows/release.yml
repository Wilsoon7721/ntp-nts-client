name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Stamp the build
        run: |
          echo "NTSCLIENT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NTSCLIENT_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "NTSCLIENT_REPO=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked

      - name: Install cargo-about and Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-about -ErrorAction SilentlyContinue)) {
            cargo install --locked --features cli cargo-about
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: pwsh
        run: ./scripts/release.ps1

      - name: Package
        run: |
          cd dist
          asset="nts-client-setup-$NTSCLIENT_VERSION.exe"
          sha256sum "$asset" > "$asset.sha256"

      - name: Release notes
        run: |
          awk -v heading="## $NTSCLIENT_VERSION" '
            { sub(/\r$/, "") }
            $0 == heading { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no section for $NTSCLIENT_VERSION"
          fi
          printf '\nBuilt from commit %s.\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "NTS Client $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
