# cargo-about settings for THIRD-PARTY-NOTICES.txt (see scripts/release.ps1).
# Where a crate offers a choice of licenses, the first one listed here is used.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crate is covered by LICENSE
private = { ignore = true }
